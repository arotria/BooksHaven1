<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookworm Haven</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Lora & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- React & Babel for JSX -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        /* Define Brand Colors and Fonts */
        :root {
            --background-hsl: 42 30% 96%;
            --primary-hsl: 25 40% 25%;
            --accent-hsl: 18 70% 55%;
            --secondary-hsl: 30 35% 88%;
            --muted-hsl: 30 25% 90%;
            
            --font-heading: 'Lora', serif;
            --font-body: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-body);
            background-color: hsl(var(--background-hsl));
            color: hsl(var(--primary-hsl));
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-heading);
            color: hsl(var(--primary-hsl));
        }
        
        .fade-in {
            animation: fadeInAnimation 0.6s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeInAnimation {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: hsl(var(--muted-hsl));
        }
        ::-webkit-scrollbar-thumb {
            background-color: hsl(var(--secondary-hsl));
            border-radius: 10px;
            border: 2px solid hsl(var(--muted-hsl));
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: hsl(var(--accent-hsl));
        }
        
        .prose {
            color: hsl(var(--primary-hsl));
        }
        .prose h2, .prose h3 {
            font-family: var(--font-heading);
            color: hsl(var(--primary-hsl));
        }
        .prose p {
            margin-bottom: 1em;
        }
        .prose a {
            color: hsl(var(--accent-hsl));
        }
        .prose strong {
            color: hsl(var(--primary-hsl));
        }

    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

        // --- ENHANCED MOCK PRODUCT DATA ---
        const mockProducts = [
            {
                id: 'gid://shopify/Product/1',
                title: 'The Midnight Library',
                author: 'Matt Haig',
                description: "Between life and death there is a library, and within that library, the shelves go on forever. Every book provides a chance to try another life you could have lived. To see how things would be if you had made other choices . . . Would you have done anything different, if you had the chance to undo your regrets?",
                longDescription: "Nora Seed's life has been full of misery and regret. She feels she has let everyone down, including herself. But when she finds herself in the Midnight Library, she has a chance to make things right. The books in the Midnight Library enable Nora to live as if she had done things differently. With the help of an old friend, she can now undo every one of her regrets as she tries to work out her perfect life. But things aren't always what she imagined they'd be, and soon her choices place the library and herself in extreme danger.",
                handle: 'the-midnight-library',
                tags: ['Fiction', 'Contemporary', 'Bestseller'],
                priceRange: { minVariantPrice: { amount: '15.99', currencyCode: 'USD' } },
                images: { edges: [{ node: { url: 'https://images.unsplash.com/photo-1619159232932-2a6a78213a1e?q=80&w=1974&auto=format&fit=crop' } }] },
                variants: { edges: [
                    { node: { id: 'gid://shopify/ProductVariant/1a', title: 'Paperback', price: { amount: '15.99' } } },
                    { node: { id: 'gid://shopify/ProductVariant/1b', title: 'Hardcover', price: { amount: '26.00' } } },
                ]},
                publisher: "Viking",
                pages: 304,
                isbn: "9780525559474",
                rating: 4.8,
                reviews: 1250
            },
            {
                id: 'gid://shopify/Product/2',
                title: 'Atomic Habits',
                author: 'James Clear',
                description: 'An easy & proven way to build good habits & break bad ones.',
                longDescription: "No matter your goals, Atomic Habits offers a proven framework for improving--every day. James Clear, one of the world's leading experts on habit formation, reveals practical strategies that will teach you exactly how to form good habits, break bad ones, and master the tiny behaviors that lead to remarkable results. If you're having trouble changing your habits, the problem isn't you. The problem is your system. Bad habits repeat themselves again and again not because you don't want to change, but because you have the wrong system for change.",
                handle: 'atomic-habits',
                tags: ['Non-Fiction', 'Self-Help', 'Bestseller'],
                priceRange: { minVariantPrice: { amount: '18.50', currencyCode: 'USD' } },
                images: { edges: [{ node: { url: 'https://images.unsplash.com/photo-1593340035959-86d4d5462a26?q=80&w=1974&auto=format&fit=crop' } }] },
                 variants: { edges: [
                    { node: { id: 'gid://shopify/ProductVariant/2a', title: 'Paperback', price: { amount: '18.50' } } },
                    { node: { id: 'gid://shopify/ProductVariant/2b', title: 'Hardcover', price: { amount: '27.00' } } },
                ]},
                publisher: "Avery",
                pages: 320,
                isbn: "9780735211292",
                rating: 4.9,
                reviews: 2300
            },
            {
                id: 'gid://shopify/Product/3',
                title: 'Dune',
                author: 'Frank Herbert',
                description: 'A stunning blend of adventure and mysticism, environmentalism and politics.',
                longDescription: "Set on the desert planet Arrakis, Dune is the story of the boy Paul Atreides, heir to a noble family tasked with ruling an inhospitable world where the only thing of value is the “spice” melange, a drug capable of extending life and enhancing consciousness. When betrayed by galactic forces, Paul must lead a rebellion to restore his family's rule and control of the planet.",
                handle: 'dune',
                tags: ['Sci-Fi', 'Classic'],
                priceRange: { minVariantPrice: { amount: '17.99', currencyCode: 'USD' } },
                images: { edges: [{ node: { url: 'https://images.unsplash.com/photo-1608178388486-75cf2e5246b2?q=80&w=1964&auto=format&fit=crop' } }] },
                 variants: { edges: [
                    { node: { id: 'gid://shopify/ProductVariant/3a', title: 'Paperback', price: { amount: '17.99' } } },
                    { node: { id: 'gid://shopify/ProductVariant/3b', title: 'Hardcover', price: { amount: '28.00' } } },
                ]},
                publisher: "Ace Books",
                pages: 412,
                isbn: "9780441013593",
                rating: 4.7,
                reviews: 1800
            },
            {
                id: 'gid://shopify/Product/4',
                title: 'The Silent Patient',
                author: 'Alex Michaelides',
                description: "A shocking psychological thriller of a woman's act of violence against her husband.",
                longDescription: "Alicia Berenson’s life is seemingly perfect. A famous painter married to an in-demand fashion photographer, she lives in a grand house with big windows overlooking a park in one of London’s most desirable areas. One evening her husband Gabriel returns home late from a fashion shoot, and Alicia shoots him five times in the face, and then never speaks another word. Alicia’s refusal to talk, or give any kind of explanation, turns a domestic tragedy into something far grander, a mystery that captures the public imagination and casts Alicia into notoriety.",
                handle: 'the-silent-patient',
                tags: ['Mystery', 'Thriller', 'Bestseller'],
                priceRange: { minVariantPrice: { amount: '14.00', currencyCode: 'USD' } },
                images: { edges: [{ node: { url: 'https://images.unsplash.com/photo-1583361543868-d3c457068560?q=80&w=1974&auto=format&fit=crop' } }] },
                 variants: { edges: [
                    { node: { id: 'gid://shopify/ProductVariant/4a', title: 'Paperback', price: { amount: '14.00' } } },
                    { node: { id: 'gid://shopify/ProductVariant/4b', title: 'Hardcover', price: { amount: '25.50' } } },
                ]},
                publisher: "Celadon Books",
                pages: 336,
                isbn: "9781250301697",
                rating: 4.6,
                reviews: 980
            },
            {
                id: 'gid://shopify/Product/5',
                title: 'Educated: A Memoir',
                author: 'Tara Westover',
                description: 'A memoir about a young girl who leaves her survivalist family to earn a PhD.',
                longDescription: "Tara Westover was 17 the first time she set foot in a classroom. Born to survivalists in the mountains of Idaho, she prepared for the end of the world by stockpiling home-canned peaches and sleeping with her “head-for-the-hills bag”. In the summer she stewed herbs for her mother, a midwife and healer, and in the winter she salvaged in her father’s junkyard. Her father forbade hospitals, so Tara never saw a doctor or nurse. Educated is an account of the struggle for self-invention. It is a tale of fierce family loyalty, and of the grief that comes with severing the closest of ties.",
                handle: 'educated-a-memoir',
                tags: ['Non-Fiction', 'Biography'],
                priceRange: { minVariantPrice: { amount: '18.99', currencyCode: 'USD' } },
                images: { edges: [{ node: { url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?q=80&w=1974&auto=format&fit=crop' } }] },
                 variants: { edges: [
                    { node: { id: 'gid://shopify/ProductVariant/5a', title: 'Paperback', price: { amount: '18.99' } } },
                    { node: { id: 'gid://shopify/ProductVariant/5b', title: 'Hardcover', price: { amount: '29.00' } } },
                ]},
                publisher: "Random House",
                pages: 352,
                isbn: "9780399590504",
                rating: 4.8,
                reviews: 1500
            },
            // ... Adding more detail to other books similarly
            {
                id: 'gid://shopify/Product/6',
                title: 'Where the Crawdads Sing',
                author: 'Delia Owens',
                description: 'A heartbreaking coming-of-age story and a surprising tale of possible murder.',
                longDescription: "For years, rumors of the “Marsh Girl” have haunted Barkley Cove, a quiet town on the North Carolina coast. So in late 1969, when handsome Chase Andrews is found dead, the locals immediately suspect Kya Clark, the so-called Marsh Girl. But Kya is not what they say. Sensitive and intelligent, she has survived for years alone in the marsh that she calls home, finding friends in the gulls and lessons in the sand. Then the time comes when she yearns to be touched and loved. When two young men from town become intrigued by her wild beauty, Kya opens herself to a new life–until the unthinkable happens.",
                handle: 'where-the-crawdads-sing',
                tags: ['Fiction', 'Mystery'],
                priceRange: { minVariantPrice: { amount: '16.50', currencyCode: 'USD' } },
                images: { edges: [{ node: { url: 'https://images.unsplash.com/photo-1591970864352-8d6d6a575a2d?q=80&w=1974&auto=format&fit=crop' } }] },
                variants: { edges: [
                    { node: { id: 'gid://shopify/ProductVariant/6a', title: 'Paperback', price: { amount: '16.50' } } },
                    { node: { id: 'gid://shopify/ProductVariant/6b', title: 'Hardcover', price: { amount: '26.50' } } },
                ]},
                publisher: "G.P. Putnam's Sons",
                pages: 384,
                isbn: "9780735219090",
                rating: 4.7,
                reviews: 1100
            },
            {
                id: 'gid://shopify/Product/7',
                title: 'The Vanishing Half',
                author: 'Brit Bennett',
                description: 'A story of twin sisters who choose to live in two very different worlds.',
                longDescription: "The Vignes twin sisters will always be identical. But after growing up together in a small, southern black community and running away at age sixteen, it's not just the shape of their daily lives that is different as adults, it's everything: their families, their communities, their racial identities. Ten years later, one sister lives with her black daughter in the same southern town she once tried to escape. The other secretly passes for white, and her white husband knows nothing of her past. Still, even separated by so many miles and just as many lies, the fates of the twins remain intertwined.",
                handle: 'the-vanishing-half',
                tags: ['Fiction', 'Contemporary', 'Bestseller'],
                priceRange: { minVariantPrice: { amount: '17.00', currencyCode: 'USD' } },
                images: { edges: [{ node: { url: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=2098&auto=format&fit=crop' } }] },
                variants: { edges: [
                    { node: { id: 'gid://shopify/ProductVariant/7a', title: 'Paperback', price: { amount: '17.00' } } },
                    { node: { id: 'gid://shopify/ProductVariant/7b', title: 'Hardcover', price: { amount: '27.50' } } },
                ]},
                publisher: "Riverhead Books",
                pages: 352,
                isbn: "9780525536291",
                rating: 4.5,
                reviews: 850
            },
        ];

        // --- CONTEXT & STATE MANAGEMENT ---
        const AppContext = createContext();

        const AppProvider = ({ children }) => {
            const [page, setPage] = useState({ name: 'home', params: {} });
            const navigate = (name, params = {}) => {
                setPage({ name, params });
                window.scrollTo(0, 0);
            };

            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [toasts, setToasts] = useState([]);

            useEffect(() => {
                const savedCart = localStorage.getItem('bookworm-haven-cart');
                if (savedCart) setCart(JSON.parse(savedCart));
            }, []);

            useEffect(() => {
                localStorage.setItem('bookworm-haven-cart', JSON.stringify(cart));
            }, [cart]);
            
            const showToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(toast => toast.id !== id));
                }, 3000);
            };

            const addToCart = (item) => {
                setCart(prevCart => {
                    const existingItem = prevCart.find(i => i.variantId === item.variantId);
                    if (existingItem) {
                        return prevCart.map(i =>
                            i.variantId === item.variantId ? { ...i, quantity: i.quantity + item.quantity } : i
                        );
                    }
                    return [...prevCart, item];
                });
                showToast(`'${item.title}' added to cart`);
            };

            const removeFromCart = (variantId) => {
                setCart(prevCart => prevCart.filter(item => item.variantId !== variantId));
            };

            const updateQuantity = (variantId, quantity) => {
                if (quantity <= 0) {
                    removeFromCart(variantId);
                    return;
                }
                setCart(prevCart =>
                    prevCart.map(item =>
                        item.variantId === variantId ? { ...item, quantity } : item
                    )
                );
            };
            
            const clearCart = () => {
                setCart([]);
            }

            const cartCount = cart.reduce((total, item) => total + item.quantity, 0);
            const cartTotal = cart.reduce((total, item) => total + item.price * item.quantity, 0);

            const value = {
                page, navigate,
                products: mockProducts,
                cart, addToCart, removeFromCart, updateQuantity, isCartOpen, setIsCartOpen, cartCount, cartTotal, clearCart,
                isCheckoutOpen, setIsCheckoutOpen,
                showToast, toasts,
            };

            return <AppContext.Provider value={value}>{children}</AppContext.Provider>;
        };
        
        const useAppContext = () => useContext(AppContext);

        // --- ICONS ---
        const BookOpenIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
        );
        const ShoppingCartIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        );
        const MenuIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg>
        );
        const XIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        );
        const PlusIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        );
        const MinusIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>
        );
        const ChevronDownIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>
        );
        const SearchIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        );
        const StarIcon = ({ className, filled = true }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        );
        
        // --- UTILITY FUNCTIONS ---
        const formatPrice = (amount, currency = 'USD') => {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency,
            }).format(amount);
        };

        // --- UI COMPONENTS ---
        const StarRating = ({ rating, reviews }) => (
            <div className="flex items-center">
                <div className="flex text-yellow-500">
                    {[...Array(5)].map((_, i) => <StarIcon key={i} className="w-4 h-4" filled={i < Math.round(rating)} />)}
                </div>
                {reviews && <span className="text-xs text-gray-500 ml-2">({reviews} reviews)</span>}
            </div>
        );

        const ToastProvider = () => {
            const { toasts } = useAppContext();
            return (
                <div className="fixed bottom-4 right-4 z-[100] space-y-2">
                    {toasts.map(toast => (
                        <div key={toast.id} className={`fade-in flex items-center justify-between p-4 rounded-lg shadow-lg text-white ${toast.type === 'success' ? 'bg-[#251605]' : 'bg-red-600'}`}>
                            <span>{toast.message}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const ProductCard = ({ product }) => {
            const { navigate, addToCart } = useAppContext();
            const { title, author, priceRange, images, rating, reviews, tags } = product;
            const isBestseller = tags.includes('Bestseller');
            
            const handleQuickAdd = (e) => {
                e.stopPropagation();
                const defaultVariant = product.variants.edges[0].node;
                addToCart({
                    variantId: defaultVariant.id,
                    productId: product.id,
                    title: product.title,
                    variantTitle: defaultVariant.title,
                    price: parseFloat(defaultVariant.price.amount),
                    quantity: 1,
                    image: images.edges[0].node.url
                });
            };

            return (
                <div 
                    className="group fade-in bg-white/50 rounded-lg shadow-sm overflow-hidden cursor-pointer transition-all duration-300 hover:shadow-xl hover:-translate-y-2 relative"
                    onClick={() => navigate('product', { handle: product.handle })}
                >
                    {isBestseller && (
                         <div className="absolute top-3 right-3 bg-[#D47547] text-white text-xs font-bold px-2 py-1 rounded-full z-10">
                            Bestseller
                        </div>
                    )}
                    <div className="overflow-hidden aspect-[3/4]">
                        <img src={images.edges[0].node.url} alt={title} className="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" />
                    </div>
                    <div className="p-4 flex flex-col h-[180px]">
                        <h3 className="text-lg font-semibold font-heading truncate">{title}</h3>
                        <p className="text-sm text-gray-600 mb-2">{author}</p>
                        <StarRating rating={rating} reviews={reviews} />
                        <div className="flex justify-between items-center mt-auto">
                            <span className="text-xl font-bold text-black">{formatPrice(priceRange.minVariantPrice.amount)}</span>
                            <button
                                onClick={handleQuickAdd}
                                className="bg-transparent border-2 border-transparent text-[#251605] font-semibold py-2 px-4 rounded-full transition-all duration-300 opacity-0 group-hover:opacity-100 group-hover:border-[#251605] hover:bg-[#251605] hover:text-white"
                            >
                                Quick Add
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ProductSkeleton = () => (
            <div className="bg-white/50 rounded-lg shadow-sm overflow-hidden animate-pulse">
                <div className="bg-gray-300 aspect-[3/4]"></div>
                <div className="p-4">
                    <div className="h-6 bg-gray-300 rounded w-3/4 mb-2"></div>
                    <div className="h-4 bg-gray-300 rounded w-full mb-4"></div>
                    <div className="h-8 bg-gray-300 rounded w-1/3"></div>
                </div>
            </div>
        );

        const CartDrawer = () => {
            const { isCartOpen, setIsCartOpen, cart, cartCount, cartTotal, removeFromCart, updateQuantity, setIsCheckoutOpen } = useAppContext();

            const handleCheckout = () => {
                setIsCartOpen(false);
                setIsCheckoutOpen(true);
            };

            return (
                <>
                    <div
                        className={`fixed inset-0 bg-black/60 z-40 transition-opacity duration-300 ${isCartOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                        onClick={() => setIsCartOpen(false)}
                    ></div>
                    <div
                        className={`fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl z-50 transform transition-transform duration-300 ${isCartOpen ? 'translate-x-0' : 'translate-x-full'}`}
                    >
                        <div className="flex flex-col h-full">
                            <div className="flex justify-between items-center p-6 border-b">
                                <h2 className="text-2xl font-heading">Your Cart ({cartCount})</h2>
                                <button onClick={() => setIsCartOpen(false)} className="p-2 rounded-full hover:bg-gray-100"><XIcon className="w-6 h-6" /></button>
                            </div>
                            
                            {cart.length === 0 ? (
                                <div className="flex-grow flex flex-col items-center justify-center text-center p-6">
                                    <ShoppingCartIcon className="w-16 h-16 text-gray-300 mb-4" />
                                    <h3 className="font-heading text-xl mb-2">Your cart is empty</h3>
                                    <p className="text-gray-500 mb-6">Looks like you haven't found your next great read yet.</p>
                                    <button
                                        onClick={() => setIsCartOpen(false)}
                                        className="bg-[#251605] text-white font-bold py-3 px-6 rounded-full hover:bg-[#D47547] transition-colors"
                                    >
                                        Continue Shopping
                                    </button>
                                </div>
                            ) : (
                                <>
                                    <div className="flex-grow overflow-y-auto p-6 space-y-4">
                                        {cart.map(item => (
                                            <div key={item.variantId} className="flex items-start space-x-4">
                                                <img src={item.image} alt={item.title} className="w-24 h-32 object-cover rounded-md" />
                                                <div className="flex-grow">
                                                    <h3 className="font-semibold">{item.title}</h3>
                                                    <p className="text-sm text-gray-500">{item.variantTitle}</p>
                                                    <p className="font-bold my-1">{formatPrice(item.price * item.quantity)}</p>
                                                    <div className="flex items-center border rounded-full w-fit mt-2">
                                                        <button onClick={() => updateQuantity(item.variantId, item.quantity - 1)} className="p-1 hover:bg-gray-100 rounded-full"><MinusIcon className="w-4 h-4" /></button>
                                                        <span className="px-3 text-sm">{item.quantity}</span>
                                                        <button onClick={() => updateQuantity(item.variantId, item.quantity + 1)} className="p-1 hover:bg-gray-100 rounded-full"><PlusIcon className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                                <button onClick={() => removeFromCart(item.variantId)} className="p-2 text-gray-400 hover:text-red-500 rounded-full hover:bg-gray-100"><XIcon className="w-5 h-5" /></button>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="p-6 border-t">
                                        <div className="flex justify-between items-center text-lg font-semibold mb-4">
                                            <span>Subtotal</span>
                                            <span>{formatPrice(cartTotal)}</span>
                                        </div>
                                        <p className="text-sm text-gray-500 text-center mb-4">Shipping & taxes calculated at checkout.</p>
                                        <button onClick={handleCheckout} className="w-full bg-[#251605] text-white font-bold py-4 px-6 rounded-full hover:bg-[#D47547] transition-colors text-lg">
                                            Proceed to Checkout
                                        </button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </>
            );
        };
        
        const CheckoutModal = () => {
            const { isCheckoutOpen, setIsCheckoutOpen, cart, cartTotal, showToast, clearCart } = useAppContext();
            const [customer, setCustomer] = useState({ name: '', email: '', address: '' });
            const [paymentMethod, setPaymentMethod] = useState('razorpay');

            const handleInputChange = (e) => {
                setCustomer({...customer, [e.target.name]: e.target.value});
            };

            const handlePlaceOrder = () => {
                if (!customer.name || !customer.email || !customer.address) {
                    showToast("Please fill in all customer details.", "error");
                    return;
                }

                if (paymentMethod === 'cod') {
                    showToast('Order placed successfully with Cash on Delivery!');
                    clearCart();
                    setIsCheckoutOpen(false);
                } else {
                    const options = {
                        "key": "rzp_test_YOUR_KEY_ID", // IMPORTANT: Replace with your Razorpay Test Key ID
                        "amount": Math.round(cartTotal * 100), // Amount is in currency subunits.
                        "currency": "USD",
                        "name": "Bookworm Haven",
                        "description": "Book Purchase",
                        "image": "https://placehold.co/100x100/D47547/FFFFFF?text=BH",
                        "handler": function (response){
                            showToast(`Payment successful! Payment ID: ${response.razorpay_payment_id}`);
                            clearCart();
                            setIsCheckoutOpen(false);
                        },
                        "prefill": {
                            "name": customer.name,
                            "email": customer.email,
                        },
                        "notes": {
                            "address": customer.address
                        },
                        "theme": {
                            "color": "#251605"
                        }
                    };
                    const rzp1 = new Razorpay(options);
                    rzp1.on('payment.failed', function (response){
                        showToast(`Payment failed: ${response.error.description}`, "error");
                    });
                    rzp1.open();
                }
            };
            
            if (!isCheckoutOpen) return null;

            return (
                <div className="fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
                    <div className="bg-white rounded-lg shadow-xl w-full max-w-2xl fade-in max-h-[90vh] flex flex-col">
                        <div className="flex justify-between items-center p-6 border-b">
                            <h2 className="text-2xl font-heading">Checkout</h2>
                            <button onClick={() => setIsCheckoutOpen(false)} className="p-2 rounded-full hover:bg-gray-100"><XIcon className="w-6 h-6" /></button>
                        </div>
                        <div className="flex-grow overflow-y-auto">
                            <div className="grid grid-cols-1 md:grid-cols-2">
                                {/* Left side: Form */}
                                <div className="p-6 border-r">
                                    <h3 className="font-semibold mb-4 text-lg">Shipping Information</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label htmlFor="name" className="block text-sm font-medium">Full Name</label>
                                            <input type="text" name="name" value={customer.name} onChange={handleInputChange} className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#D47547] focus:border-[#D47547] sm:text-sm" />
                                        </div>
                                        <div>
                                            <label htmlFor="email" className="block text-sm font-medium">Email Address</label>
                                            <input type="email" name="email" value={customer.email} onChange={handleInputChange} className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#D47547] focus:border-[#D47547] sm:text-sm" />
                                        </div>
                                         <div>
                                            <label htmlFor="address" className="block text-sm font-medium">Full Address</label>
                                            <textarea name="address" rows="3" value={customer.address} onChange={handleInputChange} className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#D47547] focus:border-[#D47547] sm:text-sm"></textarea>
                                        </div>
                                    </div>
                                    <h3 className="font-semibold mb-4 text-lg mt-6">Payment Method</h3>
                                     <div className="space-y-3">
                                        <div onClick={() => setPaymentMethod('razorpay')} className={`flex items-center gap-4 p-4 border rounded-lg cursor-pointer transition-colors ${paymentMethod === 'razorpay' ? 'bg-orange-100 border-orange-400' : 'hover:bg-gray-100'}`}>
                                            <input type="radio" name="payment" checked={paymentMethod === 'razorpay'} readOnly className="h-4 w-4 text-orange-600 border-gray-300 focus:ring-orange-500" />
                                            <span className="font-semibold">Pay with Card/UPI (Razorpay)</span>
                                        </div>
                                        <div onClick={() => setPaymentMethod('cod')} className={`flex items-center gap-4 p-4 border rounded-lg cursor-pointer transition-colors ${paymentMethod === 'cod' ? 'bg-orange-100 border-orange-400' : 'hover:bg-gray-100'}`}>
                                            <input type="radio" name="payment" checked={paymentMethod === 'cod'} readOnly className="h-4 w-4 text-orange-600 border-gray-300 focus:ring-orange-500" />
                                            <span className="font-semibold">Cash on Delivery</span>
                                        </div>
                                    </div>
                                </div>
                                {/* Right side: Summary */}
                                <div className="p-6 bg-gray-50">
                                    <h3 className="font-semibold mb-4 text-lg">Order Summary</h3>
                                    <div className="space-y-2 max-h-64 overflow-y-auto pr-2 mb-4">
                                        {cart.map(item => (
                                            <div key={item.variantId} className="flex justify-between items-center text-sm">
                                                <span className="font-medium">{item.title} <span className="text-gray-500">x{item.quantity}</span></span>
                                                <span>{formatPrice(item.price * item.quantity)}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-between items-center text-xl font-bold pt-4 border-t">
                                        <span>Total</span>
                                        <span>{formatPrice(cartTotal)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                         <div className="p-6 bg-gray-100 rounded-b-lg border-t">
                            <button onClick={handlePlaceOrder} className="w-full bg-[#251605] text-white font-bold py-3 px-6 rounded-full hover:bg-[#D47547] transition-colors text-lg">
                                {paymentMethod === 'cod' ? 'Place Order' : 'Pay Now'}
                            </button>
                        </div>
                    </div>
                </div>
            )
        };


        const Header = () => {
            const { navigate, cartCount, setIsCartOpen } = useAppContext();
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 10);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { name: 'Home', page: 'home' },
                { name: 'Shop', page: 'shop' },
                { name: 'About', page: 'about' },
                { name: 'Contact', page: 'contact' },
                { name: 'FAQ', page: 'faq' },
            ];
            
            const handleNav = (page) => {
                navigate(page);
                setIsMenuOpen(false);
            }

            return (
                <header className={`sticky top-0 z-30 transition-all duration-300 ${isScrolled ? 'bg-white/80 backdrop-blur-lg shadow-sm' : 'bg-transparent'}`}>
                    <div className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex items-center justify-between h-20">
                            {/* Logo */}
                            <a onClick={() => navigate('home')} className="flex items-center space-x-2 cursor-pointer">
                                <BookOpenIcon className="w-8 h-8 text-[#D47547]" />
                                <span className="text-2xl font-bold font-heading">Bookworm Haven</span>
                            </a>

                            {/* Desktop Nav */}
                            <nav className="hidden lg:flex items-center space-x-8">
                                {navLinks.map(link => (
                                    <a key={link.name} onClick={() => navigate(link.page)} className="text-base font-medium hover:text-[#D47547] transition-colors cursor-pointer">{link.name}</a>
                                ))}
                            </nav>

                            {/* Actions */}
                            <div className="flex items-center space-x-4">
                                <button onClick={() => setIsCartOpen(true)} className="relative p-2 rounded-full hover:bg-gray-200/50">
                                    <ShoppingCartIcon className="w-6 h-6" />
                                    {cartCount > 0 && (
                                        <span className="absolute top-0 right-0 block h-5 w-5 rounded-full bg-[#D47547] text-white text-xs flex items-center justify-center font-bold">{cartCount}</span>
                                    )}
                                </button>
                                <button className="lg:hidden p-2" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                                    <MenuIcon className="w-6 h-6" />
                                </button>
                            </div>
                        </div>
                    </div>
                    {/* Mobile Menu */}
                    {isMenuOpen && (
                        <div className="lg:hidden bg-white/95 backdrop-blur-lg">
                            <nav className="flex flex-col items-center space-y-4 py-4 border-t">
                               {navLinks.map(link => (
                                    <a key={link.name} onClick={() => handleNav(link.page)} className="text-lg font-medium hover:text-[#D47547] transition-colors cursor-pointer">{link.name}</a>
                                ))}
                            </nav>
                        </div>
                    )}
                </header>
            );
        };

        const Footer = () => {
            const { navigate } = useAppContext();
            return (
                <footer className="bg-[#EAD8C0] text-[#251605] pt-16 pb-8">
                    <div className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
                            {/* About */}
                            <div>
                                <h3 className="font-heading text-xl font-semibold mb-4">Bookworm Haven</h3>
                                <p className="text-sm">A curated selection of books for the modern reader. Find your next great adventure with us.</p>
                            </div>
                            {/* Shop */}
                            <div>
                                <h3 className="font-heading text-xl font-semibold mb-4">Shop</h3>
                                <ul className="space-y-2 text-sm">
                                    <li><a onClick={() => navigate('shop', {genre: 'Fiction'})} className="hover:text-[#D47547] cursor-pointer">Fiction</a></li>
                                    <li><a onClick={() => navigate('shop', {genre: 'Non-Fiction'})} className="hover:text-[#D47547] cursor-pointer">Non-Fiction</a></li>
                                    <li><a onClick={() => navigate('shop', {genre: 'Sci-Fi'})} className="hover:text-[#D47547] cursor-pointer">Sci-Fi</a></li>
                                    <li><a onClick={() => navigate('shop', {genre: 'Mystery'})} className="hover:text-[#D47547] cursor-pointer">Mystery</a></li>
                                </ul>
                            </div>
                            {/* Customer Service */}
                            <div>
                                <h3 className="font-heading text-xl font-semibold mb-4">Customer Service</h3>
                                <ul className="space-y-2 text-sm">
                                    <li><a onClick={() => navigate('contact')} className="hover:text-[#D47547] cursor-pointer">Contact Us</a></li>
                                    <li><a onClick={() => navigate('faq')} className="hover:text-[#D47547] cursor-pointer">FAQ</a></li>
                                    <li><a onClick={() => navigate('shipping')} className="hover:text-[#D47547] cursor-pointer">Shipping Policy</a></li>
                                    <li><a onClick={() => navigate('returns')} className="hover:text-[#D47547] cursor-pointer">Returns & Refunds</a></li>
                                     <li><a onClick={() => navigate('privacy')} className="hover:text-[#D47547] cursor-pointer">Privacy Policy</a></li>
                                    <li><a onClick={() => navigate('terms')} className="hover:text-[#D47547] cursor-pointer">Terms of Service</a></li>
                                </ul>
                            </div>
                            {/* Newsletter */}
                            <div>
                                <h3 className="font-heading text-xl font-semibold mb-4">Join Our Newsletter</h3>
                                <p className="text-sm mb-4">Get updates on new arrivals and special offers.</p>
                                <form action="https://formsubmit.co/krishsamuel1234@gmail.com" method="POST" className="flex">
                                     <input type="hidden" name="_subject" value="New Newsletter Signup!"/>
                                     <input type="hidden" name="_captcha" value="false"/>
                                    <input type="email" name="email" placeholder="Your email" required className="w-full px-4 py-2 rounded-l-full border border-r-0 border-[#251605]/50 bg-transparent focus:outline-none focus:ring-1 focus:ring-[#D47547]" />
                                    <button type="submit" className="bg-[#251605] text-white px-6 py-2 rounded-r-full hover:bg-[#D47547] transition-colors">Sign Up</button>
                                </form>
                            </div>
                        </div>
                        <div className="border-t border-[#251605]/20 pt-8 text-center text-sm">
                            <p>&copy; {new Date().getFullYear()} Bookworm Haven. All Rights Reserved.</p>
                        </div>
                    </div>
                </footer>
            );
        };

        // --- PAGE COMPONENTS ---

        const HomePage = () => {
            const { navigate, products } = useAppContext();
            const bookOfTheWeek = products[0];
            const bestsellers = products.filter(p => p.tags.includes('Bestseller')).slice(0, 4);
             const newArrivals = products.slice(8, 12);
            const genres = [
                { name: "Fiction", icon: "📖" }, { name: "Non-Fiction", icon: "🧠" },
                { name: "Sci-Fi", icon: "🚀" }, { name: "Mystery", icon: "🔍" },
            ];

            return (
                <div className="space-y-16 md:space-y-24 pb-16">
                    {/* Hero Section */}
                    <section className="relative h-[70vh] min-h-[500px] flex items-center text-center">
                        <div className="absolute inset-0 bg-cover bg-center bg-fixed" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1532012197267-da84d127e765?q=80&w=1974&auto=format&fit=crop')" }}></div>
                        <div className="absolute inset-0 bg-[#251605]/50"></div>
                        <div className="relative container mx-auto px-4 sm:px-6 lg:px-8 text-white">
                            <h1 className="text-4xl md:text-6xl font-bold font-heading fade-in" style={{animationDelay: '0.2s'}}>Find Your Next Chapter</h1>
                            <p className="text-lg md:text-xl mt-4 max-w-2xl mx-auto fade-in" style={{animationDelay: '0.4s'}}>Discover worlds, characters, and ideas that will stay with you long after the final page.</p>
                            <button onClick={() => navigate('shop')} className="mt-8 bg-[#D47547] text-white font-bold py-3 px-8 rounded-full text-lg hover:bg-opacity-90 transition-all duration-300 transform hover:scale-105 fade-in" style={{animationDelay: '0.6s'}}>Shop All Books</button>
                        </div>
                    </section>

                    {/* Book of the Week */}
                    <section className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-3xl font-heading text-center mb-8">Book of the Week</h2>
                        <div className="bg-white/70 rounded-lg shadow-lg p-8 grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
                            <img src={bookOfTheWeek.images.edges[0].node.url} alt={bookOfTheWeek.title} className="rounded-lg shadow-md w-full max-w-xs mx-auto md:w-full"/>
                            <div className="md:col-span-2 text-center md:text-left">
                                <h3 className="text-3xl font-heading font-bold mb-2">{bookOfTheWeek.title}</h3>
                                <p className="text-lg text-gray-600 mb-4">by {bookOfTheWeek.author}</p>
                                <StarRating rating={bookOfTheWeek.rating} reviews={bookOfTheWeek.reviews} />
                                <p className="my-4 leading-relaxed">{bookOfTheWeek.description}</p>
                                <button onClick={() => navigate('product', { handle: bookOfTheWeek.handle })} className="bg-[#251605] text-white font-bold py-3 px-8 rounded-full text-lg hover:bg-[#D47547] transition-colors">
                                    Discover This Book
                                </button>
                            </div>
                        </div>
                    </section>

                    {/* Bestsellers */}
                    <section className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-3xl font-heading text-center mb-8">This Week's Bestsellers</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                            {bestsellers.map(p => <ProductCard key={p.id} product={p} />)}
                        </div>
                    </section>
                    
                    {/* Browse by Genre */}
                     <section className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-3xl font-heading text-center mb-8">Browse by Genre</h2>
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-6">
                            {genres.map(genre => (
                                <div key={genre.name} onClick={() => navigate('shop', { genre: genre.name })} className="fade-in bg-[#EAD8C0] p-8 rounded-lg text-center cursor-pointer transition-all duration-300 hover:bg-[#D3CEC4] hover:shadow-lg hover:-translate-y-1">
                                    <div className="text-5xl mb-4">{genre.icon}</div>
                                    <h3 className="text-xl font-semibold font-heading">{genre.name}</h3>
                                </div>
                            ))}
                        </div>
                    </section>
                    
                     {/* New Arrivals */}
                    <section className="container mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-3xl font-heading text-center mb-8">New Arrivals</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            {products.slice(4, 8).map(p => <ProductCard key={p.id} product={p} />)}
                        </div>
                    </section>
                </div>
            );
        };

        const ShopPage = () => {
            const { products, page } = useAppContext();
            const [searchTerm, setSearchTerm] = useState('');
            const [activeGenre, setActiveGenre] = useState(page.params?.genre || 'All');
            const [sortOption, setSortOption] = useState('Featured');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                setLoading(true);
                const timer = setTimeout(() => {
                    setLoading(false);
                }, 500);
                return () => clearTimeout(timer);
            }, [searchTerm, activeGenre, sortOption]);
            
            const allGenres = ['All', ...new Set(products.flatMap(p => p.tags.filter(t => t !== 'Bestseller')))];

            const filteredAndSortedProducts = products
                .filter(p => {
                    const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase()) || p.author.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesGenre = activeGenre === 'All' || p.tags.includes(activeGenre);
                    return matchesSearch && matchesGenre;
                })
                .sort((a, b) => {
                    switch (sortOption) {
                        case 'Price: Low to High':
                            return parseFloat(a.priceRange.minVariantPrice.amount) - parseFloat(b.priceRange.minVariantPrice.amount);
                        case 'Price: High to Low':
                            return parseFloat(b.priceRange.minVariantPrice.amount) - parseFloat(a.priceRange.minVariantPrice.amount);
                        case 'Title: A-Z':
                            return a.title.localeCompare(b.title);
                        case 'Rating':
                            return b.rating - a.rating;
                        default: // Featured
                            return b.reviews - a.reviews; 
                    }
                });

            return (
                <div className="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
                    <h1 className="text-4xl font-heading text-center mb-4">Shop All Books</h1>
                    <p className="text-center text-lg text-gray-600 mb-12">Find your next favorite book from our curated collection.</p>
                    
                    {/* Filters and Search */}
                    <div className="flex flex-col md:flex-row gap-4 mb-8">
                        <div className="relative flex-grow">
                            <input
                                type="text"
                                placeholder="Search by title or author..."
                                value={searchTerm}
                                onChange={(e) => setSearchTerm(e.target.value)}
                                className="w-full pl-12 pr-4 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-[#D47547]"
                            />
                            <SearchIcon className="absolute left-4 top-1/2 -translate-y-1/2 w-6 h-6 text-gray-400"/>
                        </div>
                        <div className="relative">
                            <select
                                value={sortOption}
                                onChange={(e) => setSortOption(e.target.value)}
                                className="appearance-none w-full md:w-auto bg-white pl-4 pr-10 py-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-[#D47547]"
                            >
                                <option>Featured</option>
                                <option>Rating</option>
                                <option>Price: Low to High</option>
                                <option>Price: High to Low</option>
                                <option>Title: A-Z</option>
                            </select>
                            <ChevronDownIcon className="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500 pointer-events-none" />
                        </div>
                    </div>

                    {/* Genre Filters */}
                    <div className="flex flex-wrap justify-center gap-2 mb-12">
                        {allGenres.map(genre => (
                            <button
                                key={genre}
                                onClick={() => setActiveGenre(genre)}
                                className={`px-4 py-2 rounded-full text-sm font-medium transition-colors ${
                                    activeGenre === genre 
                                        ? 'bg-[#251605] text-white' 
                                        : 'bg-white hover:bg-gray-100'
                                }`}
                            >
                                {genre}
                            </button>
                        ))}
                    </div>

                    {/* Product Grid */}
                    {loading ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                           {[...Array(8)].map((_, i) => <ProductSkeleton key={i} />)}
                        </div>
                    ) : filteredAndSortedProducts.length > 0 ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                            {filteredAndSortedProducts.map(p => <ProductCard key={p.id} product={p} />)}
                        </div>
                    ) : (
                        <div className="text-center py-20">
                            <h2 className="text-2xl font-heading mb-2">No books found</h2>
                            <p className="text-gray-600">Try adjusting your search or filters.</p>
                        </div>
                    )}
                </div>
            );
        };
        
        const ProductDetailPage = () => {
            const { products, page, addToCart, navigate } = useAppContext();
            const product = products.find(p => p.handle === page.params.handle);
            
            if (!product) {
                 return (
                    <div className="text-center py-20">
                        <h2 className="text-2xl font-heading mb-2">Product Not Found</h2>
                        <button onClick={() => navigate('shop')} className="mt-4 bg-[#D47547] text-white font-bold py-3 px-8 rounded-full text-lg hover:bg-opacity-90">Back to Shop</button>
                    </div>
                );
            }
            
            const [selectedVariantId, setSelectedVariantId] = useState(product.variants.edges[0].node.id);
            const [quantity, setQuantity] = useState(1);
            
            const selectedVariant = product.variants.edges.find(v => v.node.id === selectedVariantId)?.node;
            const relatedProducts = products.filter(p => p.tags.some(tag => product.tags.includes(tag)) && p.id !== product.id).slice(0, 4);

            const handleAddToCart = () => {
                addToCart({
                    variantId: selectedVariant.id,
                    productId: product.id,
                    title: product.title,
                    variantTitle: selectedVariant.title,
                    price: parseFloat(selectedVariant.price.amount),
                    quantity: quantity,
                    image: product.images.edges[0].node.url
                });
            };

            return (
                <div className="container mx-auto px-4 sm:px-6 lg:px-8 py-12">
                    <div className="text-sm mb-4">
                      <a onClick={() => navigate('shop')} className="hover:underline cursor-pointer">Shop</a> / {product.title}
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                        {/* Image Gallery */}
                        <div className="fade-in">
                            <img src={product.images.edges[0].node.url} alt={product.title} className="w-full rounded-lg shadow-lg" />
                        </div>
                        {/* Product Details */}
                        <div className="fade-in" style={{animationDelay: '0.2s'}}>
                            <h1 className="text-4xl font-heading font-bold mb-2">{product.title}</h1>
                            <p className="text-lg text-gray-500 mb-4">by {product.author}</p>
                            <div className="mb-4">
                                <StarRating rating={product.rating} reviews={product.reviews} />
                            </div>
                            <p className="text-4xl font-bold mb-6">{formatPrice(selectedVariant.price.amount)}</p>
                            
                            {/* Variant Selector */}
                             <div className="mb-6">
                                <h3 className="text-sm font-semibold mb-2">Format</h3>
                                <div className="flex gap-2">
                                    {product.variants.edges.map(({node: variant}) => (
                                        <button 
                                            key={variant.id}
                                            onClick={() => setSelectedVariantId(variant.id)}
                                            className={`px-4 py-2 rounded-full text-sm font-medium border-2 transition-colors ${selectedVariantId === variant.id ? 'bg-[#251605] text-white border-[#251605]' : 'bg-transparent border-gray-300 hover:border-[#251605]'}`}
                                        >
                                            {variant.title}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Quantity & Add to Cart */}
                            <div className="flex items-center gap-4 mb-6">
                                <div className="flex items-center border rounded-full">
                                    <button onClick={() => setQuantity(q => Math.max(1, q - 1))} className="p-3 hover:bg-gray-100 rounded-full"><MinusIcon className="w-5 h-5"/></button>
                                    <span className="px-4 text-lg">{quantity}</span>
                                    <button onClick={() => setQuantity(q => q + 1)} className="p-3 hover:bg-gray-100 rounded-full"><PlusIcon className="w-5 h-5"/></button>
                                </div>
                                <button onClick={handleAddToCart} className="flex-grow bg-[#251605] text-white font-bold py-4 px-6 rounded-full hover:bg-[#D47547] transition-colors text-lg">Add to Cart</button>
                            </div>
                            
                            <div className="prose">
                                <h3>Description</h3>
                                <p className="text-gray-700 leading-relaxed">{product.longDescription}</p>
                                <h3>Product Details</h3>
                                <ul>
                                    <li><strong>Publisher:</strong> {product.publisher}</li>
                                    <li><strong>Pages:</strong> {product.pages}</li>
                                    <li><strong>ISBN:</strong> {product.isbn}</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    {/* Related Books */}
                    {relatedProducts.length > 0 && (
                        <div className="mt-24">
                            <h2 className="text-3xl font-heading text-center mb-8">You Might Also Like</h2>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                                {relatedProducts.map(p => <ProductCard key={p.id} product={p} />)}
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        const GenericContentPage = ({ title, children }) => (
            <div className="bg-white/80">
                <div className="container mx-auto px-4 sm:px-6 lg:px-8 py-16">
                    <div className="bg-white p-8 md:p-12 rounded-lg shadow-md">
                        <h1 className="text-4xl font-heading text-center mb-12">{title}</h1>
                        <div className="prose max-w-3xl mx-auto">
                            {children}
                        </div>
                    </div>
                </div>
            </div>
        );
        
        const AboutPage = () => (
            <GenericContentPage title="Our Story">
                <p>Bookworm Haven was born from a simple, yet powerful idea: to create a space where book lovers can find not just books, but stories that resonate, ideas that challenge, and worlds that inspire. We believe in the magic of a good book and the community it can build.</p>
                <p>Our mission is to curate a diverse and thoughtful collection of books, from timeless classics to contemporary gems, ensuring that every reader finds their next great adventure on our shelves. We're more than just a bookstore; we're a haven for the curious, the dreamers, and the lifelong learners.</p>
                 <h3>Our Philosophy</h3>
                <p>We believe that reading is a transformative experience. That's why every book in our collection is hand-picked by our team of passionate curators. We look for stories that are not only well-written but also have the power to spark conversations, broaden perspectives, and leave a lasting impact.</p>
            </GenericContentPage>
        );

        const ContactPage = () => (
            <GenericContentPage title="Get In Touch">
                <p className="text-center mb-8">Have a question or just want to talk about books? We'd love to hear from you!</p>
                <form action="https://formsubmit.co/krishsamuel1234@gmail.com" method="POST" className="space-y-6">
                    <input type="hidden" name="_subject" value="New Contact Form Submission!"/>
                    <input type="hidden" name="_captcha" value="false"/>
                    <div>
                        <label htmlFor="name" className="block text-sm font-medium">Name</label>
                        <input type="text" id="name" name="name" required className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#D47547] focus:border-[#D47547] sm:text-sm" />
                    </div>
                     <div>
                        <label htmlFor="email" className="block text-sm font-medium">Email</label>
                        <input type="email" id="email" name="email" required className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#D47547] focus:border-[#D47547] sm:text-sm" />
                    </div>
                     <div>
                        <label htmlFor="message" className="block text-sm font-medium">Message</label>
                         <textarea id="message" name="message" rows="4" required className="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-[#D47547] focus:border-[#D47547] sm:text-sm"></textarea>
                    </div>
                    <div>
                        <button type="submit" className="w-full bg-[#251605] text-white font-bold py-3 px-6 rounded-full hover:bg-[#D47547] transition-colors">Send Message</button>
                    </div>
                </form>
            </GenericContentPage>
        );

        const FAQPage = () => (
             <GenericContentPage title="Frequently Asked Questions">
                <div className="space-y-6">
                    <div>
                        <h2 className="text-xl font-semibold font-heading">What are your shipping options?</h2>
                        <p>We offer standard and expedited shipping options. Shipping costs and delivery times are calculated at checkout based on your location and the weight of your order. Standard shipping typically takes 5-7 business days, while expedited shipping takes 2-3 business days.</p>
                    </div>
                    <div>
                        <h2 className="text-xl font-semibold font-heading">What is your return policy?</h2>
                        <p>We accept returns for books in their original condition within 30 days of purchase. If you're not satisfied with your order, please contact our support team to initiate a return. Please note that return shipping costs are the responsibility of the customer unless the book arrived damaged.</p>
                    </div>
                     <div>
                        <h2 className="text-xl font-semibold font-heading">How can I track my order?</h2>
                        <p>Once your order has shipped, you will receive an email confirmation with a tracking number. You can use this number on the carrier's website to track the status of your delivery.</p>
                    </div>
                     <div>
                        <h2 className="text-xl font-semibold font-heading">What payment methods do you accept?</h2>
                        <p>We accept all major credit cards (Visa, MasterCard, American Express) as well as payments through UPI and other providers via Razorpay. We also offer a Cash on Delivery (COD) option for your convenience.</p>
                    </div>
                </div>
            </GenericContentPage>
        );
        
        const ShippingPolicyPage = () => (
            <GenericContentPage title="Shipping Policy">
                <h2>Processing Time</h2>
                <p>All orders are processed within 1-2 business days. Orders are not shipped or delivered on weekends or holidays.</p>
                <h2>Shipping Rates & Delivery Estimates</h2>
                <p>Shipping charges for your order will be calculated and displayed at checkout. Delivery delays can occasionally occur.</p>
                <h2>Shipment Confirmation & Order Tracking</h2>
                <p>You will receive a Shipment Confirmation email once your order has shipped containing your tracking number(s). The tracking number will be active within 24 hours.</p>
            </GenericContentPage>
        );

        const ReturnsPolicyPage = () => (
            <GenericContentPage title="Returns & Refunds">
                <p>Our policy lasts 30 days. If 30 days have gone by since your purchase, unfortunately, we can’t offer you a refund or exchange.</p>
                <p>To be eligible for a return, your item must be unused and in the same condition that you received it. It must also be in the original packaging.</p>
                <h2>Refunds</h2>
                <p>Once your return is received and inspected, we will send you an email to notify you that we have received your returned item. We will also notify you of the approval or rejection of your refund. If you are approved, then your refund will be processed, and a credit will automatically be applied to your original method of payment, within a certain amount of days.</p>
            </GenericContentPage>
        );
        
        const PrivacyPolicyPage = () => (
            <GenericContentPage title="Privacy Policy">
                <p>We respect your privacy and are committed to protecting it. This Privacy Policy describes the types of information we may collect from you or that you may provide when you visit our website and our practices for collecting, using, maintaining, protecting, and disclosing that information.</p>
                <h2>Information We Collect</h2>
                <p>We collect several types of information from and about users of our Website, including information by which you may be personally identified, such as name, postal address, e-mail address, telephone number ("personal information").</p>
                <h2>How We Use Your Information</h2>
                <p>We use information that we collect about you or that you provide to us, including any personal information to present our Website and its contents to you, to provide you with information, products, or services that you request from us, and to fulfill any other purpose for which you provide it.</p>
            </GenericContentPage>
        );
        
        const TermsOfServicePage = () => (
             <GenericContentPage title="Terms of Service">
                <h2>1. Terms</h2>
                <p>By accessing the website at Bookworm Haven, you are agreeing to be bound by these terms of service, all applicable laws and regulations, and agree that you are responsible for compliance with any applicable local laws.</p>
                <h2>2. Use License</h2>
                <p>Permission is granted to temporarily download one copy of the materials (information or software) on Bookworm Haven's website for personal, non-commercial transitory viewing only. This is the grant of a license, not a transfer of title.</p>
                <h2>3. Disclaimer</h2>
                <p>The materials on Bookworm Haven's website are provided on an 'as is' basis. Bookworm Haven makes no warranties, expressed or implied, and hereby disclaims and negates all other warranties including, without limitation, implied warranties or conditions of merchantability, fitness for a particular purpose, or non-infringement of intellectual property or other violation of rights.</p>
             </GenericContentPage>
        );


        // --- MAIN APP COMPONENT ---
        const App = () => {
            const { page } = useAppContext();

            const renderPage = () => {
                switch(page.name) {
                    case 'home': return <HomePage />;
                    case 'shop': return <ShopPage />;
                    case 'product': return <ProductDetailPage />;
                    case 'about': return <AboutPage />;
                    case 'contact': return <ContactPage />;
                    case 'faq': return <FAQPage />;
                    case 'shipping': return <ShippingPolicyPage />;
                    case 'returns': return <ReturnsPolicyPage />;
                    case 'privacy': return <PrivacyPolicyPage />;
                    case 'terms': return <TermsOfServicePage />;
                    default: return <HomePage />;
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <Header />
                    <main className="flex-grow">
                        {renderPage()}
                    </main>
                    <Footer />
                    <CartDrawer />
                    <CheckoutModal />
                    <ToastProvider />
                </div>
            );
        };
        
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(
            <AppProvider>
                <App />
            </AppProvider>
        );

    </script>
</body>
</html>
